# Every system service that fails (after systemd's own restarts give up) starts pi-alert@<unit>.service, which sends
# a Telegram message as the user (machine-setup/raspberry-pi/alert, README.md "Alerts"). restore.sh's alerts step
# installs it as /etc/systemd/system/service.d/10-pi-alert.conf; pi-alert@.service.d/ clears it for the alert unit.
[Unit]
OnFailure=pi-alert@%n.service
