# Every user service that fails (after systemd's own restarts give up) starts pi-alert@<unit>.service, which sends a
# Telegram message (machine-setup/raspberry-pi/alert, README.md "Alerts"). ~/.config/systemd/user/service.d links
# here (restore.sh's alerts step). pi-alert@.service.d/ clears it for the alert unit itself.
[Unit]
OnFailure=pi-alert@%n.service
