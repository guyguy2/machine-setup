[project]
name = "pi-status"
version = "0.1.0"
description = "Single-page status site for a Raspberry Pi: system, network, agents, sign-ins, containers (served over Tailscale)"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
pi-status = "pi_status:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "playwright>=1.64.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
