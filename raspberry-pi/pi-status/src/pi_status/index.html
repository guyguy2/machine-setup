<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pi Status</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%231f9d55'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7; --card: #fff; --text: #1d1d1f; --muted: #6e6e73; --track: #e5e5ea;
    --ok: #1f9d55; --warn: #d97706; --bad: #dc2626; --accent: #2563eb; --accent-bg: #e8f0fe;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111113; --card: #1c1c1f; --text: #f2f2f4; --muted: #9a9aa2; --track: #2c2c30;
            --accent: #60a5fa; --accent-bg: #1e2a44; --ok: #34d399; --warn: #fbbf24; --bad: #f87171; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, -apple-system, sans-serif; }

  /* layout: sidebar on the left, tabs at its top */
  .layout { display: grid; grid-template-columns: 210px minmax(0, 1fr); min-height: 100vh; }
  .side { position: sticky; top: 0; align-self: start; height: 100vh; padding: 16px 12px; overflow-y: auto;
          display: flex; flex-direction: column;
          background: var(--card); border-right: 1px solid var(--track); }
  .brand { padding: 0 8px 12px; }
  .brand h1 { font-size: 1.25rem; margin: 0; overflow-wrap: anywhere; }
  .sub { color: var(--muted); font-size: .8125rem; }
  nav { display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }
  nav a { display: block; padding: 9px 12px; border-radius: 8px; color: var(--text); text-decoration: none; }
  nav a:hover { background: var(--track); }
  nav a[aria-current="page"] { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
  nav a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .version { margin-top: auto; padding: 12px 8px 0; font: .75rem/1.4 ui-monospace, "SF Mono", Menlo, monospace; color: var(--muted); overflow-wrap: anywhere; }
  .version .stale { display: block; color: var(--warn); font-weight: 600; }
  .version .copy { margin-top: 6px; font-size: .75rem; }
  .brand .copy { margin-top: 8px; }
  .content { padding: 16px 24px 32px; max-width: 1000px; width: 100%; }
  h2 { font-size: 1.25rem; margin: 0 0 12px; }
  h3 { font-size: 1rem; margin: 20px 0 8px; }

  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--ok); margin-right: 6px; }
  .dot.off { background: var(--bad); }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
  .card { background: var(--card); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
  .grid .card { margin-bottom: 0; }
  .label { color: var(--muted); font-size: .8125rem; text-transform: uppercase; letter-spacing: .04em; }
  .value { font-size: 1.75rem; font-weight: 600; font-variant-numeric: tabular-nums; margin: 2px 0 8px; }
  .detail { color: var(--muted); font-size: .875rem; }
  .bar { height: 6px; background: var(--track); border-radius: 3px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .4s, background .4s; }
  .bar > i.warn { background: var(--warn); } .bar > i.bad { background: var(--bad); }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; }
  dt { color: var(--muted); } dd { margin: 0; overflow-wrap: anywhere; }
  .alert { background: var(--bad); color: #fff; border-radius: 12px; padding: 10px 16px; margin-bottom: 12px; }
  .empty { color: var(--muted); }

  .card-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
  .card-head strong { font-size: 1.0625rem; }
  .pill { display: inline-block; padding: 1px 9px; border-radius: 99px; font-size: .75rem; font-weight: 600;
          background: var(--track); color: var(--muted); white-space: nowrap; }
  .pill.ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
  .pill.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
  .pill.bad { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }

  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .875rem; }
  th { text-align: left; color: var(--muted); font-weight: 500; font-size: .75rem; text-transform: uppercase;
       letter-spacing: .04em; padding: 6px 10px 6px 0; white-space: nowrap; }
  td { padding: 6px 10px 6px 0; border-top: 1px solid var(--track); vertical-align: top; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.num, td.nowrap { white-space: nowrap; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: .8125rem; }
  .cmd .clamp { max-width: 380px; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
                overflow-wrap: anywhere; }
  .seg { display: inline-flex; border: 1px solid var(--track); border-radius: 8px; overflow: hidden; margin-bottom: 10px; }
  .seg button { border: 0; background: transparent; color: var(--text); padding: 5px 14px; font: inherit; font-size: .875rem; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--accent-bg); color: var(--accent); font-weight: 600; }

  .ssh-row, .page-row { display: grid; grid-template-columns: minmax(150px, 230px) minmax(0, 1fr) auto; gap: 4px 12px;
             align-items: center; padding: 7px 0; border-top: 1px solid var(--track); }
  .ssh-row:first-child, .page-row { border-top: 0; padding-top: 0; }
  .page-row { padding-bottom: 0; }
  a.ssh-cmd { color: var(--accent); text-decoration: none; }
  a.ssh-cmd:hover { text-decoration: underline; }
  .ssh-label { color: var(--muted); font-size: .875rem; }
  .ssh-cmd { margin: 0; padding: 4px 8px; background: var(--bg); border-radius: 6px; overflow-x: auto; white-space: pre; user-select: all; }
  .ssh-config { grid-column: 1 / 3; }
  .copy { border: 1px solid var(--track); background: transparent; color: var(--text); border-radius: 6px; padding: 3px 10px;
          font: inherit; font-size: .8125rem; cursor: pointer; min-width: 64px; }
  .copy:hover { background: var(--track); }
  .card-head .status { display: inline-flex; align-items: center; gap: 10px; }
  .session { padding: 6px 0; border-top: 1px solid var(--track); overflow-wrap: anywhere; }
  .session details summary { margin-top: 2px; }
  .signins summary { margin: 0; color: var(--text); font-size: 1rem; }
  .signins details[open] summary { margin-bottom: 8px; }
  .copy:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* agent lab: one fixed color per agent (validated categorical slots 1-3, light and dark) */
  :root { --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; }
  @media (prefers-color-scheme: dark) { :root { --s1: #3987e5; --s2: #d95926; --s3: #199e70; } }
  .s1 { --s: var(--s1); } .s2 { --s: var(--s2); } .s3 { --s: var(--s3); }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--s); margin-right: 6px; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: .875rem; margin-bottom: 10px; }
  .lab-row { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 12px; align-items: center; padding: 6px 0; }
  .lab-label { font-size: .875rem; }
  .lab-bars { display: flex; flex-direction: column; gap: 2px; }
  .lab-bar { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 2.5em; gap: 8px; align-items: center;
             height: 14px; outline: none; }
  .lab-track { height: 8px; background: repeating-linear-gradient(to right, transparent 0 calc(20% - 1px), var(--track) calc(20% - 1px) 20%); }
  .lab-track > i { display: block; height: 100%; background: var(--s); border-radius: 0 4px 4px 0; }
  .lab-val { font-size: .75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .lab-bar:hover .lab-track, .lab-bar:focus-visible .lab-track { box-shadow: 0 0 0 2px var(--card), 0 0 0 3px var(--s); }
  .lab-bar:hover::after, .lab-bar:focus-visible::after {
    content: attr(data-tip); position: absolute; left: 0; bottom: 18px; z-index: 1; white-space: nowrap; pointer-events: none;
    background: var(--text); color: var(--card); font-size: .75rem; padding: 3px 8px; border-radius: 6px; }
  .lab-axis { display: grid; grid-template-columns: 110px minmax(0, 1fr) 2.5em; gap: 0 12px; }
  .lab-axis div:nth-child(2) { display: flex; justify-content: space-between; color: var(--muted); font-size: .6875rem; }
  a.cell { color: inherit; text-decoration: none; white-space: nowrap; }
  a.cell:hover { text-decoration: underline; }
  details summary { cursor: pointer; color: var(--muted); font-size: .875rem; margin-top: 6px; }
  .note h4 { font-size: .9375rem; margin: 16px 0 6px; } .note h4:first-child { margin-top: 0; }
  .note p { margin: 0 0 8px; } .note ul, .note ol { margin: 0 0 8px; padding-left: 22px; }
  .note pre, .prompt { margin: 0 0 8px; padding: 8px 10px; background: var(--bg); border-radius: 6px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .note code { background: var(--bg); padding: 0 4px; border-radius: 4px; }

  /* phones: sidebar becomes a tab strip along the top */
  @media (max-width: 720px) {
    .layout { display: block; }
    .side { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--track); padding: 12px 16px 8px; }
    .brand { padding: 0 0 8px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    nav { flex-direction: row; overflow-x: auto; margin: 0 -8px; }
    .version { margin-top: 0; padding: 6px 0 0; }
    nav a { white-space: nowrap; }
    .content { padding: 16px; }
    .ssh-row, .page-row { grid-template-columns: minmax(0, 1fr) auto; }
    .ssh-label { grid-column: 1 / 3; }
    .ssh-config { grid-column: 1; }
    .value { font-size: 1.5rem; }
    .lab-row, .lab-axis { grid-template-columns: 76px minmax(0, 1fr); }
    .lab-axis div:last-child { display: none; }
    /* tables: each row is a block, its first cell the title and the others "label: value" lines */
    table, tbody, tr, td { display: block; }
    thead { display: none; }
    tbody tr { padding: 8px 0; border-top: 1px solid var(--track); }
    tbody tr:first-child { border-top: 0; padding-top: 0; }
    td, td.num { padding: 1px 0; border-top: 0; text-align: left; overflow-wrap: anywhere; }
    td:first-child { font-weight: 600; }
    td:not(:first-child)::before { content: attr(data-label) ": "; color: var(--muted); font: .8125rem system-ui, -apple-system, sans-serif; }
    .cmd .clamp { display: block; max-width: none; }
  }
</style>
</head>
<body>
<div class="layout">
  <aside class="side">
    <div class="brand">
      <h1 id="host">Pi Status</h1>
      <div class="sub" id="model"></div>
      <div class="sub" id="conn"><span class="dot off"></span>connecting…</div>
      <button class="copy" id="refresh" type="button">Refresh</button>
    </div>
    <nav id="nav" aria-label="Sections"></nav>
    <div class="version" id="version"></div>
  </aside>
  <main class="content" id="view"></main>
</div>

<script>
// ---------- helpers ----------
const $ = id => document.getElementById(id);

// Build DOM with textContent only, so command lines and names can never inject markup.
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid);
  return el;
}

const gb = b => (b / 2**30).toFixed(1) + " GB";
const size = b => b >= 2**30 ? gb(b) : (b / 2**20).toFixed(0) + " MB";
function dur(s) {
  if (s < 60) return s + "s";
  const d = Math.floor(s / 86400), hr = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return [d && d + "d", (d || hr) && hr + "h", m + "m"].filter(Boolean).join(" ");
}
const pill = (text, kind) => h("span", { class: "pill " + (kind || "") }, text);
const empty = text => h("div", { class: "card empty" }, text);

// On phones each row stacks into a block, its cells labelled from data-label (see the 720px media query).
function table(cols, rows) {
  const cells = rows.map(r => cols.map(c => c.value(r)));
  // a column that is "–" in every row says nothing; `keep` ones stay anyway (the Lab scoreboard's agents with no runs)
  const shown = cols.map((c, i) => c.keep || !rows.length || cells.some(row => row[i] !== "–"));
  const pick = list => list.filter((_, i) => shown[i]);
  return h("div", { class: "scroll" }, h("table", {},
    h("thead", {}, h("tr", {}, pick(cols).map(c => h("th", { class: c.num ? "num" : "" }, c.label)))),
    h("tbody", {}, cells.map(row => h("tr", {}, pick(cols.map((c, i) => {
      const v = row[i];
      const td = h("td", { class: [c.num && "num", c.nowrap && "nowrap", c.mono && "mono", c.cmd && "cmd"].filter(Boolean).join(" "),
                           "data-label": typeof c.label === "string" ? c.label : c.label.textContent },  // Lab's labels are nodes
                   c.cmd ? h("div", { class: "clamp" }, v) : v);
      if (c.cmd) td.title = String(v);
      return td;
    })))))));
}

function copyButton(text) {
  const btn = h("button", { class: "copy", type: "button" }, "Copy");
  btn.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(text);
      btn.textContent = "Copied";
    } catch {
      btn.textContent = "Select & copy";  // clipboard needs HTTPS; fall back to manual copy
    }
    setTimeout(() => (btn.textContent = "Copy"), 1500);
  });
  return btn;
}

function bar(pct, warn, bad) {
  const i = h("i");
  i.style.width = Math.min(pct, 100) + "%";
  i.className = pct >= bad ? "bad" : pct >= warn ? "warn" : "";
  return h("div", { class: "bar" }, i);
}

function metric(label, value, pct, warn, bad, detail) {
  return h("div", { class: "card" },
    h("div", { class: "label" }, label), h("div", { class: "value" }, value),
    bar(pct, warn, bad), h("div", { class: "detail" }, detail));
}

// ---------- views ----------
const procCols = [
  { label: "PID", num: true, value: p => p.pid },
  { label: "CPU", num: true, value: p => p.cpu.toFixed(1) + "%" },
  { label: "Memory", num: true, value: p => size(p.rss) },
  { label: "Up", num: true, value: p => dur(p.age_s) },
  { label: "User", value: p => p.user },
];
const cmdCol = { label: "Command", mono: true, cmd: true, value: p => p.cmd };

function brand(s) {
  document.title = s.hostname + " – Pi Status";
  $("host").textContent = s.hostname;
  $("model").textContent = s.model;
}

function overview(s) {
  brand(s);
  const mp = s.mem_used / s.mem_total * 100, dp = s.disk_used / s.disk_total * 100;
  return [
    h("h2", {}, "Overview"),
    s.throttled.length && h("div", { class: "alert" }, "Power/thermal: " + s.throttled.join(", ")),
    h("div", { class: "grid" },
      metric("CPU", s.cpu_percent + "%", s.cpu_percent, 70, 90, `load ${s.load.join(" / ")} · ${s.cpus} cores`),
      metric("Temperature", s.temp_c + " °C", s.temp_c / 85 * 100, 70, 90, "throttles at 80 °C"),
      metric("Memory", mp.toFixed(0) + "%", mp, 75, 90, `${gb(s.mem_used)} of ${gb(s.mem_total)}`),
      metric("Disk (/)", dp.toFixed(0) + "%", dp, 80, 92, `${gb(s.disk_used)} of ${gb(s.disk_total)}`)),
    h("div", { class: "card", style: "margin-top:12px" }, h("dl", {},
      h("dt", {}, "Model"), h("dd", {}, s.model),  // also in the sidebar; repeated here on purpose
      h("dt", {}, "Uptime"), h("dd", {}, dur(s.uptime_s)),
      h("dt", {}, "OS"), h("dd", {}, s.os),
      h("dt", {}, "Kernel"), h("dd", {}, s.kernel),
      h("dt", {}, "Connected to"), h("dd", {}, s.connection),
      h("dt", {}, "Local IP"), h("dd", {}, s.local_ip ? `${s.local_ip} (gateway ${s.gateway})` : "–"),
      h("dt", {}, "Tailscale IP"), h("dd", {}, s.tailscale_ip || "–"))),
  ];
}

function network(n) {
  const ts = n.tailscale || {};
  const stateKind = { up: "ok", down: "", unknown: "ok" };
  const ssh = n.ssh;
  return [
    h("h2", {}, "Network"),

    n.page_url && [
      h("h3", { style: "margin-top:0" }, "Open this page"),
      h("div", { class: "card" }, h("div", { class: "page-row" },
        h("div", { class: "ssh-label" }, "From any device on your tailnet"),
        h("a", { class: "mono ssh-cmd", href: n.page_url }, n.page_url),
        copyButton(n.page_url))),
    ],

    h("h3", { style: n.page_url ? null : "margin-top:0" }, "Connect with SSH"),
    h("div", { class: "card" },
      ssh.commands.map(c => h("div", { class: "ssh-row" },
        h("div", { class: "ssh-label" }, c.label),
        h("code", { class: "mono ssh-cmd" }, c.command),
        copyButton(c.command))),
      h("div", { class: "ssh-row" },
        h("div", { class: "ssh-label" }, "Shortcut (after adding the config below)"),
        h("code", { class: "mono ssh-cmd" }, ssh.shortcut.command),
        copyButton(ssh.shortcut.command)),
      h("div", { class: "sub", style: "margin:12px 0 4px" }, "Add this to ~/.ssh/config on the machine you connect from:"),
      h("div", { class: "ssh-row" },
        h("pre", { class: "mono ssh-cmd ssh-config" }, ssh.shortcut.config),
        copyButton(ssh.shortcut.config))),

    h("div", { class: "card" }, h("dl", {},
      h("dt", {}, "Connected to"), h("dd", {}, n.connection),
      n.wifi.ssid && [h("dt", {}, "Wi-Fi"), h("dd", {}, `${n.wifi.signal}% signal · ${n.wifi.rate} · channel ${n.wifi.channel} · ${n.wifi.security}`)],
      h("dt", {}, "Local IP"), h("dd", {}, n.local_ip || "–"),
      h("dt", {}, "Gateway"), h("dd", {}, n.gateway ? `${n.gateway} via ${n.device}` : "–"),
      h("dt", {}, "DNS"), h("dd", {}, n.dns.join(", ") || "–"),
      ts.dns_name && [h("dt", {}, "Tailscale name"), h("dd", {}, ts.dns_name)])),

    h("h3", {}, "Interfaces"),
    h("div", { class: "card" }, table([
      { label: "Name", value: i => i.name },
      { label: "State", value: i => pill(i.state === "unknown" ? "up" : i.state, stateKind[i.state]) },  // tunnels report "unknown"
      { label: "Addresses", mono: true, value: i => i.addresses.join("  ") || "–" },
      { label: "MAC", mono: true, value: i => i.mac || "–" },
    ], n.interfaces)),

    h("h3", {}, `Tailscale peers (${(ts.peers || []).length})`),
    (ts.peers || []).length
      ? h("div", { class: "card" }, table([
          { label: "Machine", value: p => p.name + (p.exit_node ? " (exit node)" : "") },
          { label: "Status", value: p => pill(p.online ? "online" : "offline", p.online ? "ok" : "") },
          { label: "IP", mono: true, value: p => p.ip },
          { label: "OS", value: p => p.os },
          { label: "Path", value: p => p.online ? p.path || "–" : p.last_seen ? "seen " + new Date(p.last_seen).toLocaleDateString() : "–" },
        ], ts.peers))
      : empty("No other machines on this tailnet."),

    h("h3", {}, "Logged-in sessions"),
    n.sessions.length
      ? h("div", { class: "card" }, table([
          { label: "User", value: s => s.user },
          { label: "Terminal", mono: true, value: s => s.tty },
          { label: "Since", nowrap: true, value: s => s.since },
          { label: "From", mono: true, value: s => s.origin },
        ], n.sessions))
      : empty("No one is logged in."),
  ];
}

const AUTH_PILL = {
  signed_in: ["signed in", "ok"], signed_out: ["signed out", "warn"], expired: ["expired", "bad"],
  error: ["error", "bad"], not_installed: ["not installed", ""],
};

function signIns(auth) {
  if (!auth) return [h("h3", {}, "Sign-ins"), empty("Sign-in status unavailable.")];
  const ago = Math.max(0, Math.round(Date.now() / 1000 - auth.checked_at));
  const ok = auth.services.filter(a => a.state === "signed_in").length;
  return [
    h("h3", {}, "Sign-ins"),
    h("div", { class: "card signins" }, h("details", { open: ok < auth.services.length || null },  // opens itself when one needs you
      h("summary", {}, `${ok} of ${auth.services.length} signed in · checked ${dur(ago)} ago`),
      table([
        { label: "Service", value: a => h("span", {}, a.name, " ", h("span", { class: "sub mono" }, a.command)) },
        { label: "Status", value: a => pill(...AUTH_PILL[a.state] || [a.state, ""]) },
        { label: "Account", value: a => a.account || "–" },
        { label: "Details", value: a => a.detail || "–" },
      ], auth.services),
      h("div", { class: "sub", style: "margin-top:8px" }, "Local checks only; no tokens are shown."))),
  ];
}

const copyRow = (label, text, el = h("code", { class: "mono ssh-cmd" }, text)) => h("div", { class: "ssh-row" },
  h("div", { class: "ssh-label" }, label), el, copyButton(text));

let agentError = "";  // the last failed Start/Stop, shown above the cards until the next attempt

async function controlAgent(btn, unit, action) {
  agentError = "";
  btn.disabled = true;
  btn.textContent = action === "stop" ? "Stopping…" : "Starting…";  // a graceful stop can take a while
  try {
    const r = await fetch(`/api/agents/${encodeURIComponent(unit)}/${action}`,
                          { method: "POST", headers: { "X-Requested-With": "pi-status" } });
    const body = await r.json();
    if (!r.ok) throw new Error(body.error || r.status);
  } catch (e) {
    agentError = `Couldn't ${action} ${unit}: ${e.message}`;
  }
  refresh();
}

function serviceButton(a) {
  const up = ["active", "activating", "reloading"].includes(a.unit_state);
  if (a.unit_state === "deactivating") return h("button", { class: "copy", type: "button", disabled: true }, "Stopping…");
  return h("button", {
    class: "copy service-btn", type: "button",
    title: up ? `Stop ${a.unit} gracefully (SIGTERM, then time to clean up). It starts again at boot or with Start.`
              : `Start ${a.unit}`,
    onclick: e => controlAgent(e.currentTarget, a.unit, up ? "stop" : "start"),
  }, up ? "Stop" : "Start");
}

const UNIT_STATUS = { active: ["running", "ok"], reloading: ["running", "ok"], activating: ["starting", "warn"],
                      deactivating: ["stopping", "warn"], failed: ["failed", "bad"] };  // anything else: stopped

// An agent with a service goes by its unit; one without (Claude Code) by its processes.
function agentStatus(a, d) {
  if (!a.unit) return a.instances.length ? [`running · ${a.instances.length}`, "ok"] : ["stopped", ""];
  const [word, kind] = UNIT_STATUS[a.unit_state] || ["stopped", ""];
  if (word === "running" && d && d.local_url && !d.running) return ["starting", "warn"];  // up, dashboard not listening yet
  return [word, kind];
}

// oldest process's uptime, total CPU and memory
const usage = ps => `up ${dur(Math.max(...ps.map(p => p.age_s)))} · ${ps.reduce((t, p) => t + p.cpu, 0).toFixed(1)}% CPU · ${size(ps.reduce((t, p) => t + p.rss, 0))}`;

const session = p => h("div", { class: "session" },
  h("span", { class: "mono" }, p.cwd || "–"), h("span", { class: "sub" }, ` · up ${dur(p.age_s)} · ${size(p.rss)}`),
  h("details", {}, h("summary", {}, "Command"), h("pre", { class: "mono prompt" }, p.cmd)));

function agentCard(a, d) {
  const [word, kind] = agentStatus(a, d);
  const web = d && d.local_url;
  const ps = a.instances;
  const summary = [
    a.unit && ps.length && (UNIT_STATUS[a.unit_state] ? usage(ps) : `running outside ${a.unit}: ${usage(ps)}`),
    d && !web && d.what,
  ].filter(Boolean).join(" · ");
  return h("div", { class: "card agent" },
    h("div", { class: "card-head" },
      h("strong", {}, a.name), h("span", { class: "sub" }, a.kind),
      h("span", { class: "status" }, pill(word, kind), a.unit && serviceButton(a))),  // wraps as one: status beside its button
    summary && h("div", { class: "detail" }, summary),
    web && (d.tailnet_url
      ? copyRow(d.running ? "On your tailnet" : "On your tailnet (once it's running)", d.tailnet_url,
                h("a", { class: "mono ssh-cmd", href: d.tailnet_url, target: "_blank", rel: "noopener", title: d.what }, d.tailnet_url))
      : copyRow("On your tailnet (not published yet)", d.publish)),
    !a.unit && ps.map(session),
    a.unit && h("details", {}, h("summary", {}, "More"),
      web && [copyRow("Without Tailscale: tunnel over SSH", d.tunnel), copyRow("…then open on that machine", d.local_url)],
      h("div", { class: "sub", style: "margin:8px 0" }, "Service: ", h("span", { class: "mono" }, a.unit)),
      ps.length && table([
        ...procCols,
        { label: "Directory", mono: true, value: p => p.cwd },
        { label: "Listening", mono: true, value: p => p.ports.join(", ") || "–" },
        cmdCol,
      ], ps)));
}

function agents(list, auth, dash) {
  const byName = Object.fromEntries((dash || []).map(d => [d.name, d]));
  const live = a => agentStatus(a, byName[a.name])[0] !== "stopped";
  return [
    h("h2", {}, "Agents & assistants"),
    agentError && h("div", { class: "alert" }, agentError),
    !dash && h("div", { class: "sub", style: "margin-bottom:12px" }, "Dashboard status unavailable."),
    [...list].sort((a, b) => live(b) - live(a)).map(a => agentCard(a, byName[a.name])),
    signIns(auth),
  ];
}

// ---------- agent lab ----------
const LAB_SCORES = [
  ["score_outcome", "Outcome"], ["score_quality", "Quality"], ["score_autonomy", "Autonomy"], ["score_safety", "Safety"],
  ["score_ux", "UX"], ["score_happiness", "Happiness"], ["overall", "Overall"],
];
const LAB_MEASURES = [
  ["duration_min", "Minutes, wall clock"], ["my_effort_min", "Minutes, my effort"], ["followups", "Follow-ups"],
  ["peak_rss_mb", "Peak memory (MB)"], ["avg_cpu_pct", "CPU (% of one core)"],
];
const OUTCOME_PILL = { pass: ["pass", "ok"], partial: ["partial", "warn"], fail: ["fail", "bad"] };
const RISK_KIND = { "read-only": "ok", writes: "warn", money: "bad" };

const mean = xs => { const v = xs.filter(x => x != null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
const num = (x, digits = 1) => x == null ? "–" : String(+x.toFixed(digits));
const outcomePill = o => pill(...OUTCOME_PILL[o] || ["not scored", ""]);
const runLink = (r, ...kids) => h("a", { class: "cell", href: "#lab/" + encodeURIComponent(r.file) }, ...kids);

// Just enough markdown for run notes: headings, lists, checkboxes, code fences, `code`, paragraphs.
function markdown(text) {
  const out = [];
  let list = null, para = null, fence = null;
  const inline = s => s.split(/`([^`]+)`/).map((part, i) => i % 2 ? h("code", {}, part) : part.replace(/\*\*/g, ""));
  for (const line of text.split("\n")) {
    if (fence) { if (line.startsWith("```")) { out.push(h("pre", {}, fence.join("\n"))); fence = null; } else fence.push(line); continue; }
    if (line.startsWith("```")) { fence = []; list = para = null; continue; }
    const item = line.match(/^\s*(?:[-*]|\d+\.)\s+(.*)$/), head = line.match(/^#{1,4}\s+(.*)$/);
    if (head) { out.push(h("h4", {}, inline(head[1]))); list = para = null; }
    else if (item) {
      if (!list) out.push(list = h("ul"));
      list.append(h("li", {}, inline(item[1].replace(/^\[ \]/, "☐").replace(/^\[x\]/i, "☑"))));
      para = null;
    } else if (!line.trim()) list = para = null;
    else if (para) para.append(" ", ...inline(line.trim()));
    else { out.push(para = h("p", {}, inline(line.trim()))); list = null; }
  }
  if (fence) out.push(h("pre", {}, fence.join("\n")));
  return h("div", { class: "note" }, out);
}

function scoreChart(agents, runs) {
  const scored = runs.some(r => LAB_SCORES.some(([k]) => r[k] != null));
  if (!scored) return empty("No scores yet. They appear here once you fill them in at the end of a run.");
  return h("div", { class: "card" },
    h("div", { class: "legend" }, agents.map((a, i) => h("span", {}, h("span", { class: "swatch s" + (i + 1) }), a.name))),
    LAB_SCORES.map(([key, label]) => h("div", { class: "lab-row" },
      h("div", { class: "lab-label" }, label),
      h("div", { class: "lab-bars" }, agents.map((a, i) => {
        const v = mean(runs.filter(r => r.agent === a.id).map(r => r[key]));
        const fill = h("i");
        fill.style.width = v == null ? "0" : v / 5 * 100 + "%";
        return h("div", { class: "lab-bar s" + (i + 1), tabindex: "0",
                          "data-tip": `${a.name} · ${label}: ${v == null ? "not scored yet" : num(v) + " / 5"}` },
          h("span", { class: "lab-track" }, fill), h("span", { class: "lab-val" }, num(v)));
      })))),
    h("div", { class: "lab-axis" }, h("div"), h("div", {}, [0, 1, 2, 3, 4, 5].map(n => h("span", {}, n))), h("div")),
    h("div", { class: "sub", style: "margin-top:8px" }, "Average of every scored run, 1–5. Hover a bar for its value."));
}

function labRun(d, file) {
  const r = d.runs.find(r => r.file === file);
  const back = h("a", { class: "copy", href: "#lab", style: "text-decoration:none;display:inline-block" }, "← Back");
  if (!r) return [h("h2", {}, "Agent lab"), back, empty(`No run note called ${file}.`)];
  const uc = d.use_cases.find(u => u.id === r.use_case);
  const agent = d.agents.find(a => a.id === r.agent);
  const field = (label, v) => v != null && v !== "" && [h("dt", {}, label), h("dd", {}, v)];
  return [
    h("h2", {}, `${r.use_case}${uc ? " " + uc.title : ""} on ${agent ? agent.name : r.agent}`),
    h("div", { style: "margin-bottom:12px" }, back),
    h("div", { class: "card" }, h("dl", {},
      field("Result", outcomePill(r.outcome)),
      field("Date", r.date), field("Version", r.version), field("Model", r.model), field("Interface", r.interface),
      LAB_SCORES.flatMap(([k, label]) => field(label, r[k] == null ? null : num(r[k]) + " / 5")),
      LAB_MEASURES.flatMap(([k, label]) => field(label, r[k] == null ? null : num(r[k]))))),
    h("div", { class: "card" }, r.note.trim() ? markdown(r.note) : h("span", { class: "empty" }, "The note is empty.")),
    h("div", { class: "sub mono" }, `${d.path}/runs/${r.file}`),
  ];
}

function lab(d) {
  if (!d.found) return [h("h2", {}, "Agent lab"), empty(`No agent lab at ${d.path}. Its use cases and run notes show up here once it exists.`)];
  if (subpath) return labRun(d, subpath);
  const { agents, runs, use_cases: ucs } = d;
  const ofAgent = id => runs.filter(r => r.agent === id);
  // a function, because a header node can only sit in one table at a time
  const agentCols = () => agents.map((a, i) => ({ label: h("span", {}, h("span", { class: "swatch s" + (i + 1) }), a.name), id: a.id }));
  return [
    h("h2", {}, "Agent lab"),
    h("div", { class: "card-head", style: "margin-bottom:12px" },
      h("span", { class: "sub" }, "Running now:"),
      agents.map(a => pill(a.name + (a.running ? " · running" : ""), a.running ? "ok" : ""))),

    h("h3", {}, "Scoreboard"),
    h("div", { class: "card" },
      table([
        { label: "Use case", value: u => h("span", {}, h("span", { class: "mono" }, u.id), " ", u.title) },
        ...agentCols().map(c => ({ label: c.label, keep: true, value: u => {
          const mine = runs.filter(r => r.use_case === u.id && r.agent === c.id);
          const r = mine[mine.length - 1];
          return r ? runLink(r, outcomePill(r.outcome), r.overall != null ? ` ${num(r.overall)}/5` : "",
                             mine.length > 1 ? h("span", { class: "sub" }, ` · ${mine.length} runs`) : "") : "–";
        } })),
      ], ucs),
      h("div", { class: "sub", style: "margin-top:8px" }, "Latest run for each use case and agent. Click one to read its note.")),

    h("h3", {}, "How they compare"),
    scoreChart(agents, runs),

    h("h3", {}, "Time & resources"),
    h("div", { class: "card" }, table([
      { label: "Average per run", value: m => m[1] },
      ...agentCols().map(c => ({ label: c.label, num: true, value: m => m[0] === "runs" ? ofAgent(c.id).length : num(mean(ofAgent(c.id).map(r => r[m[0]]))) })),
    ], [["runs", "Runs"], ...LAB_MEASURES])),

    h("h3", {}, "My take"),
    h("div", { class: "grid" }, agents.map((a, i) => h("div", { class: "card" },
      h("div", { class: "card-head" }, h("span", { class: "swatch s" + (i + 1) }), h("strong", {}, a.name)),
      d.impressions[a.id] ? markdown(d.impressions[a.id]) : h("span", { class: "empty" }, "Nothing yet: write it under “Overall impressions” in results.md.")))),

    h("h3", {}, `Runs (${runs.length})`),
    runs.length
      ? h("div", { class: "card" }, table([
          { label: "Date", value: r => runLink(r, r.date || r.file) },
          { label: "Use case", mono: true, value: r => r.use_case },
          { label: "Agent", value: r => (agents.find(a => a.id === r.agent) || { name: r.agent }).name },
          { label: "Outcome", value: r => outcomePill(r.outcome) },
          { label: "Overall", num: true, value: r => r.overall == null ? "–" : num(r.overall) + "/5" },
          { label: "Minutes", num: true, value: r => num(r.duration_min) },
        ], [...runs].reverse()))
      : empty("No runs yet. Start one on the Pi with: bin/lab run UC-001 openhuman"),

    h("h3", {}, `Use cases (${ucs.length})`),
    ucs.map(u => h("div", { class: "card" },
      h("div", { class: "card-head" }, h("strong", {}, `${u.id} ${u.title}`),
        u.category && pill(u.category), u.risk && pill(u.risk, RISK_KIND[u.risk])),
      u.prompt && h("details", {}, h("summary", {}, "Prompt"),
        h("pre", { class: "mono prompt" }, u.prompt), copyButton(u.prompt)))),
    h("div", { class: "sub mono" }, `Read from ${d.path} · switch agents with bin/lab use <agent>`),
  ];
}

function docker(d) {
  if (!d.installed) return [h("h2", {}, "Docker"), empty("Docker isn't installed on this Pi. Containers will appear here once it is.")];
  if (d.error) return [h("h2", {}, "Docker"), h("div", { class: "card" }, pill("error", "bad"), " ", d.error)];
  if (!d.containers.length) return [h("h2", {}, "Docker"), empty("Docker is installed, but there are no containers.")];
  return [h("h2", {}, "Docker"), h("div", { class: "card" }, table([
    { label: "Name", value: c => c.name },
    { label: "State", value: c => pill(c.state, c.state === "running" ? "ok" : c.state === "exited" ? "" : "warn") },
    { label: "Image", mono: true, value: c => c.image },
    { label: "Status", value: c => c.status },
    { label: "Ports", mono: true, value: c => c.ports || "–" },
  ], d.containers))];
}

function services(s) {
  const section = (title, rows) => [
    h("h3", {}, `${title} (${rows.length})`),
    rows.length ? h("div", { class: "card" }, table([
      { label: "Unit", mono: true, value: r => r.unit },
      { label: "State", value: r => pill(r.active === "failed" ? "failed" : r.sub, r.active === "failed" ? "bad" : "ok") },
      { label: "Description", value: r => r.description },
    ], rows)) : empty("None"),
  ];
  return [h("h2", {}, "Services"), section("Your user services", s.user), section("System services", s.system)];
}

let procSort = "cpu";
function processes(d) {
  const key = procSort === "cpu" ? "cpu" : "rss";
  const rows = [...d.processes].sort((a, b) => b[key] - a[key]).slice(0, 25);
  const seg = (id, label) => h("button", { "aria-pressed": String(procSort === id), onclick: () => { procSort = id; refresh(); } }, label);
  return [
    h("h2", {}, "Processes"),
    h("div", { class: "seg", role: "group", "aria-label": "Sort by" }, seg("cpu", "Top by CPU"), seg("mem", "Top by memory")),
    h("div", { class: "card" }, table([...procCols, cmdCol], rows)),
    h("div", { class: "sub" }, `${d.total} processes in total`),
  ];
}

function ports(list) {
  const kind = { "local only": "", "tailnet": "ok", "all interfaces": "warn", "network": "warn" };
  return [
    h("h2", {}, "Listening ports"),
    h("div", { class: "card" }, table([
      { label: "Port", num: true, value: p => p.port },
      { label: "Address", mono: true, value: p => p.address },
      { label: "Reachable from", value: p => pill(p.exposure, kind[p.exposure]) },
      { label: "Process", value: p => p.process ? `${p.process} (${p.pid})` : "–" },
    ], list)),
    h("div", { class: "sub" }, "Process names are only visible for your own processes; root-owned ones show –."),
  ];
}

const TABS = [
  { id: "overview", title: "Overview", api: "/api/status", render: overview },
  { id: "network", title: "Network", api: "/api/network", render: network },
  { id: "agents", title: "Agents", api: "/api/agents", also: ["/api/auth", "/api/dashboards"], render: agents },
  { id: "lab", title: "Agent lab", api: "/api/lab", render: lab },
  { id: "docker", title: "Docker", api: "/api/docker", render: docker },
  { id: "services", title: "Services", api: "/api/services", render: services },
  { id: "processes", title: "Processes", api: "/api/processes", render: processes },
  { id: "ports", title: "Ports", api: "/api/ports", render: ports },
];

// ---------- version (bottom of the sidebar) ----------
let restarting = false;

async function restartServer(btn) {
  restarting = true;
  btn.disabled = true;
  btn.textContent = "Restarting…";
  // The custom header is what stops other websites from triggering this POST.
  try { await fetch("/api/restart", { method: "POST", headers: { "X-Requested-With": "pi-status" } }); } catch {}
  for (let i = 0; i < 30; i++) {  // wait for the new process, then reload to pick up the new page too
    await new Promise(r => setTimeout(r, 1000));
    try {
      const v = await getJSON("/api/version");
      if (!v.stale) { location.reload(); return; }
    } catch {}  // the server is down for a moment while it restarts
  }
  restarting = false;
  btn.disabled = false;
  btn.textContent = "Restart now";
}

async function loadVersion() {
  if (restarting) return;
  const el = $("version");
  try {
    const v = await getJSON("/api/version");
    const btn = v.stale && v.can_restart && h("button", { class: "copy", type: "button", onclick: e => restartServer(e.currentTarget) }, "Restart now");
    el.replaceChildren(...[v.label, v.stale && h("span", { class: "stale" }, "newer code on disk: " + (btn ? "restart to update" : "restart the server to update")), btn].filter(Boolean));
    el.title = v.stale
      ? `Running: ${v.running_label}\nOn disk:  ${v.label}`
      : v.dirty ? "Includes changes that aren't committed yet" : "Running the latest committed code";
  } catch {
    el.replaceChildren("version unavailable");
  }
}

// ---------- routing & refresh ----------
let current = TABS[0];
let subpath = "";  // what follows the tab in the hash: #lab/<run note> opens that note

$("nav").append(...TABS.map(t => h("a", { href: "#" + t.id, "data-tab": t.id }, t.title)));

async function getJSON(url) {
  const r = await fetch(url, { cache: "no-store" });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || r.status);
  return data;
}

async function refresh() {
  const tab = current;
  try {
    const [data, ...extra] = await Promise.all([
      getJSON(tab.api),
      ...(tab.also || []).map(url => getJSON(url).catch(() => null)),  // optional extras never break the tab
    ]);
    if (tab !== current) return;  // user switched tabs while this was loading
    $("view").replaceChildren(...[tab.render(data, ...extra)].flat(Infinity).filter(Boolean));
    $("conn").replaceChildren(h("span", { class: "dot" }), "updated " + new Date().toLocaleTimeString());
  } catch (e) {
    $("conn").replaceChildren(h("span", { class: "dot off" }), "unreachable");
    if (tab === current && !$("view").children.length) $("view").replaceChildren(empty("Couldn't load: " + e.message));
  }
}

function route() {
  const [id, ...rest] = location.hash.slice(1).split("/");
  current = TABS.find(t => t.id === id) || TABS[0];
  subpath = decodeURIComponent(rest.join("/"));
  for (const a of $("nav").children) {
    if (a.dataset.tab === current.id) a.setAttribute("aria-current", "page");
    else a.removeAttribute("aria-current");
  }
  $("view").replaceChildren();
  refresh();  // once per tab visit; nothing polls in the background, use the Refresh button for fresh numbers
}

addEventListener("hashchange", route);
route();
loadVersion();

$("refresh").addEventListener("click", async e => {
  const btn = e.currentTarget;
  btn.disabled = true;
  btn.textContent = "Refreshing…";
  await Promise.all([refresh(), loadVersion()]);
  btn.disabled = false;
  btn.textContent = "Refresh";
});
// the sidebar shows the hostname whichever tab is open
if (current.id !== "overview") fetch("/api/status").then(r => r.json()).then(brand).catch(() => {});
</script>
