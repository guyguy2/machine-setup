// ---------- home: Emails shows the mail sorter's suggestions (/api/emails reads its state.json); REI is live ----------
const NO_COUNT = "—";

// Emails' queues (#emails/<id>), in triage order. state.json sends the same eight with counts (and its own hints);
// these titles and hints are for when it isn't connected yet.
const QUEUES = [
  { id: "inbox", title: "Inbox", hint: "Not sorted yet" },
  { id: "action", title: "Action", hint: "Something to do: pay, sign, book" },
  { id: "respond", title: "Respond", hint: "Someone is waiting for your reply" },
  { id: "review", title: "Review", hint: "Worth reading, then archive" },
  { id: "drafts", title: "Drafts", hint: "Replies ready to edit and send" },
  { id: "waiting", title: "Waiting", hint: "You wrote; they owe you a reply" },
  { id: "later", title: "Later", hint: "Not sure yet: left in your inbox, unread" },
  { id: "delete", title: "Delete", hint: "Safe to trash, with a reason for each" },
  { id: "agent-notes", title: "Agent Notes", hint: "Questions and rules for you to approve" },
];
const SUGGESTED = ["action", "respond", "review", "delete"];  // what a suggestion can be
const CHOICES = [...SUGGESTED, "nar", "later"];
const CHOICE_TITLE = { nar: "No action" };  // a button's words, when not its queue's title
const CHOICE_HINT = { nar: "No action needed: mark it read and keep it in your inbox; it leaves this page (never deleted)",
                      later: "Not sure yet: leave it unread in your inbox, filed under Later" };
const choiceTitle = c => CHOICE_TITLE[c] || queueTitle(c);  // where a card can be moved; the others are set by the sorter
const NO_DOT = new Set(["inbox", "delete", "later"]);                 // Inbox is a highlighted pill, Delete and Later plain counts
const NOTE_LEVEL = { info: ["info", ""], warn: ["warning", "warn"], question: ["question", "question"] };
const queueTitle = id => (QUEUES.find(q => q.id === id) || { title: id }).title;

let lastMail = null;  // the last /api/emails answer: the nav badge, the tab title and Overview's attention list read it
let mailQuery = "";   // what's in the Emails search box; cleared when you pick a queue
let pageTitle = "Home Base";

function ago(iso) {
  const t = Date.parse(iso);
  if (isNaN(t)) return "";
  const s = Math.max(0, Math.round((Date.now() - t) / 1000));
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  if (s < 7 * 86400) return Math.floor(s / 86400) + "d ago";
  return new Date(t).toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

const needsYou = d => d && d.connected ? d.needs_you || 0 : 0;  // Action + Respond

// Grey, by the page title: when the sorter last checked Gmail and roughly when it checks next
function mailFresh(d) {
  const last = d.sync?.last_success, at = Date.parse(last), boot = d.sync?.bootstrap;
  const clock = t => new Date(t).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  const next = !isNaN(at) && d.every_s ? at + d.every_s * 1000 : NaN;
  const text = d.error ? "Email data: can't be read" : !d.connected ? "Email data: not connected yet"
    : isNaN(at) ? "Gmail not checked yet"
    : `Gmail checked ${ago(last)}${next > Date.now() ? ` · next ~${clock(next)}` : ""}${boot && !boot.done ? " · still learning from past mail" : ""}`;
  if (d.connected && !d.error && d.syncing)
    return h("span", { class: "sub mail-fresh", role: "status" }, h("span", { class: "spin", "aria-hidden": "true" }), " Checking Gmail…");
  return h("span", { class: "sub mail-fresh", title: isNaN(at) ? null : "Last Gmail check: " + new Date(at).toLocaleString() }, text,
    d.connected && !d.error && h("span", {}, " · ",
      h("button", { class: "linkish quiet", type: "button", title: "Check Gmail and sort new mail now (the hourly run, early)",
                    onclick: e => syncNow(e.currentTarget) }, "Sync now")));
}

// Sync now: start the sorter's run, then look every few seconds until it's done and redraw once with the new mail
let syncWatch = null;
async function syncNow(btn) {
  btn.disabled = true;
  let r = null, out;
  try {
    r = await fetch("/api/emails/sync", { method: "POST", body: "{}",
      headers: { "X-Requested-With": "pi-status", "Content-Type": "application/json" } });
    out = await r.json();
  } catch (e) {
    out = { ok: false, error: "Couldn't reach Home Base: " + e.message };
  }
  if (out.ok && out.state) {
    redrawMail(out.state);
    return;
  }
  btn.disabled = false;
  btn.closest(".mail-fresh").after(h("span", { class: "act-error", role: "alert" }, out.error || `Failed (${r?.status})`));
}

function watchSync() {
  if (syncWatch) return;
  const until = Date.now() + 15 * 60 * 1000;  // a stuck run shows up as stale anyway
  syncWatch = setInterval(async () => {
    let d = null;
    try { d = await getJSON("/api/emails"); } catch { return; }
    if (d.syncing && Date.now() < until) return;
    clearInterval(syncWatch);
    syncWatch = null;
    redrawMail(d);
  }, 4000);
}

// A broken sorter (unreadable file, failed run, or no run for 3 hours), or null. Not set up yet isn't a problem.
function mailProblem(d) {
  if (!d) return null;
  if (d.error) return { kind: "bad", text: d.error };
  if (!d.connected) return null;
  const failed = d.sync.ok === false;
  if (!failed && !d.stale) return null;
  const head = failed ? "last run failed" : d.age_s == null ? "can't tell when it last checked Gmail" : `hasn't checked Gmail for ${dur(d.age_s)}`;
  return { kind: failed ? "bad" : "warn", text: head + (d.sync.error ? ": " + d.sync.error : "") };
}

function setTitle() {
  const n = needsYou(lastMail);
  document.title = (n > 0 ? `(${n}) ` : "") + pageTitle;
}

// The Emails nav link's red "needs you" badge, the tab title, and Overview's attention list (if it's on screen)
function mailBadge(d) {
  lastMail = d;
  const n = needsYou(d);
  const link = $("nav").querySelector("a[data-tab=emails]");
  const label = link.closest(".nav-group").querySelector(".nav-label");  // shows the badge while the group is folded
  for (const el of [link, label]) {
    el.querySelector(".nav-badge")?.remove();
    if (n > 0) el.append(h("span", { class: "nav-badge", title: `${n} need${n === 1 ? "s" : ""} you (Action + Respond)` }, String(n)));
  }
  setTitle();
  if (overviewData) $("view").querySelector(".attention")?.replaceWith(attentionCard());
}

// Once on page load and on Refresh when another tab is open (the Emails tab's own fetch does it there); never polls
async function loadMail() {
  try { mailBadge(await getJSON("/api/emails")); } catch {}  // the badge just stays as it was
}

function queueBadge(d, q) {
  if (!d.connected) return h("span", { class: "count", "aria-label": "count not available" }, NO_COUNT);
  if (!q.count) return null;  // an empty queue shows nothing at all
  const overdue = q.id === "waiting" && q.overdue > 0;
  return h("span", { class: "q-badge", title: overdue ? `${q.overdue} overdue` : null },
    q.confirmed > 0 && h("span", { class: "q-confirmed", title: `you confirmed ${q.confirmed} of ${q.count}` }, q.confirmed + "✓"),
    !NO_DOT.has(q.id) && h("span", { class: `q-dot q-${q.id}${overdue ? " overdue" : ""}` }),
    h("span", { class: "count" + (q.id === "inbox" ? " inbox" : "") }, String(q.count)));
}

// ---- choices: POST to /api/emails/<action>, which runs the sorter's `mail` command and answers with the new state ----
// What the last choice did, shown where its card was when the card has left the view (you work up from the bottom,
// so it must not jump to the top). `before`: the cards that came before it, nearest first, to find that place.
let mailFlash = null;

async function mailAct(btn, action, body, said) {
  const box = btn.closest(".thread, .mail-trash, .mail-accept, .mail-flash");  // a reason box is inside one of these  // its buttons are locked while this runs
  const buttons = [...box.querySelectorAll("button")];
  const top = box.getBoundingClientRect().top;  // after the redraw, this place stays put on screen
  const before = [...$("view").querySelectorAll(".thread")]  // the cards above this one, nearest first
    .filter(c => c !== box && c.compareDocumentPosition(box) & Node.DOCUMENT_POSITION_FOLLOWING).map(c => c.dataset.thread).reverse();
  buttons.forEach(b => (b.disabled = true));
  box.querySelector(".act-error")?.remove();
  const spin = h("span", { class: "spin", role: "status", "aria-label": "Working…" });
  btn.after(spin);
  let r = null, out;
  try {
    r = await fetch("/api/emails/" + action, { method: "POST", body: JSON.stringify(body),
      headers: { "X-Requested-With": "pi-status", "Content-Type": "application/json" } });
    out = await r.json();
  } catch (e) {
    out = { ok: false, error: r ? `Home Base answered ${r.status}` : "Couldn't reach Home Base: " + e.message };
  }
  if (r?.ok && out.ok !== false && out.state) {
    mailFlash = said(out.state, out);
    if (mailFlash && !mailFlash.before) mailFlash = { ...mailFlash, before };
    redrawMail(out.state, body.thread, top);
    return true;
  }
  spin.remove();
  buttons.forEach(b => (b.disabled = b.dataset.locked === "1"));
  box.append(h("div", { class: "act-error", role: "alert" }, out.error || `Failed (${r?.status})`));
  return false;
}

function redrawMail(state, thread, top) {
  if (current.id !== "emails") return mailBadge(state);
  lastLoad = { view: currentView, args: [state] };
  const tall = $("view").offsetHeight;
  show(current, emails(state));
  // the page keeps its height (until the next refresh or tab), or a card leaving near the bottom would pull it down
  if (top != null) $("view").style.minHeight = tall + "px";
  const card = thread && $("view").querySelector(`.thread[data-thread="${CSS.escape(thread)}"]`);
  const flash = $("view").querySelector(".mail-flash");
  const here = card || flash;
  if (here && top != null) window.scrollBy(0, here.getBoundingClientRect().top - top);  // no jumping: it's where you clicked
  (card ? card.querySelector(".undo") : flash?.querySelector("button") || flash)?.focus({ preventScroll: true });  // keep the keyboard nearby
}

const subjectOf = t => `“${t.subject || "(no subject)"}”`;

function decide(btn, t, queue) {
  mailAct(btn, "decide", { thread: t.id, queue }, () => ({ thread: t.id, subject: t.subject, undo: true, reasonable: true,
    text: queue === "done" ? `${subjectOf(t)} archived (Done)` : queue === "nar" ? `${subjectOf(t)}: no action needed`
                           : `${subjectOf(t)} → ${queueTitle(queue)}` }));
}

// Your reason for a choice, optional: "Add a reason" opens a one-line box; Enter saves, Escape cancels.
function reasonLine(thread, reason, onSaved) {
  const line = h("div", { class: "reason" });
  const view = () => line.replaceChildren(...(reason
    ? [h("span", { class: "said" }, `Your reason: “${reason}”`), h("button", { class: "linkish", type: "button", onclick: edit }, "Edit")]
    : [h("button", { class: "linkish", type: "button", onclick: edit, title: "Optional: why you chose this, so it learns" }, "Add a reason")]));
  function edit() {
    const input = h("input", { type: "text", maxlength: "500", "aria-label": "Your reason", value: reason || "",
                               placeholder: "e.g. I declined; he just said thanks" });
    const save = h("button", { class: "copy", type: "button", onclick: () => submit() }, "Save");
    const submit = () => mailAct(save, "reason", { thread, text: input.value }, (state, out) => onSaved(out.reason));
    input.addEventListener("keydown", e => {
      if (e.key === "Enter") submit();
      if (e.key === "Escape") view();
    });
    line.replaceChildren(input, save, h("button", { class: "linkish", type: "button", onclick: view }, "Cancel"));
    input.focus();
  }
  view();
  return line;
}

function undo(btn, t) {
  mailAct(btn, "undo", { thread: t.id }, state => {
    const now = state.threads.find(x => x.id === t.id);
    return { thread: t.id, text: `${subjectOf(t)} is back${now ? " in " + queueTitle(now.queue) : ""}` };
  });
}

// What accepting does, per queue, for the confirm
const ACCEPT_EFFECT = { action: "labelled, stay in your inbox", respond: "labelled, stay in your inbox",
                        review: "labelled and archived", delete: "marked for Trash (nothing is trashed yet)" };

// Every suggestion this view shows and you haven't chosen yet, as if you clicked each one's highlighted button
function acceptAll(btn, pending) {
  const n = pending.length, by = {};
  pending.forEach(t => (by[t.rec.queue] = (by[t.rec.queue] || 0) + 1));
  const lines = SUGGESTED.filter(q => by[q]).map(q => `${by[q]} → ${queueTitle(q)}: ${ACCEPT_EFFECT[q]}`);
  if (!confirm(`Accept ${n} suggestion${n === 1 ? "" : "s"}?\n\n${lines.join("\n")}\n\nAll are marked read. Each card keeps its Undo.`)) return;
  mailAct(btn, "accept", { items: pending.map(t => ({ thread: t.id, queue: t.rec.queue })) }, (state, out) => {
    const k = typeof out.accepted === "number" ? out.accepted : n;
    const extra = [out.skipped && `${out.skipped} skipped (changed since the page loaded)`, out.failed && `${out.failed} failed; try again`];
    return { text: [`Accepted ${k} suggestion${k === 1 ? "" : "s"}.`, ...extra.filter(Boolean)].join(" · ") };
  });
}

function trashAll(btn, ids) {
  const n = ids.length, emails = `${n} email${n === 1 ? "" : "s"}`;
  if (!confirm(`Move ${emails} to Gmail Trash? You can restore them for 30 days.`)) return;
  mailAct(btn, "trash", { ids }, (state, out) => ({ text: `Moved ${typeof out.trashed === "number" ? out.trashed : n} to Gmail Trash.` }));
}

// ---- reply drafts: Claude writes one when you ask; you edit it here; Save puts it in Gmail Drafts (never sends) ----
const draftEdits = {};  // thread id -> your unsaved edits, kept across redraws
const canDraft = t => t.draft || t.queue === "respond" || t.rec?.queue === "respond" || t.decided?.queue === "respond";

function focusDraft(thread) {
  $("view").querySelector(`.thread[data-thread="${CSS.escape(thread)}"] .draft textarea`)?.focus();
}

// "Draft a reply" (or "Redo"): an optional one-line note on what to say, then Claude writes it (about half a minute)
function draftAsk(t, onCancel, redo) {
  const input = h("input", { type: "text", maxlength: "500", "aria-label": "What should the reply say? (optional)",
                             value: t.draft?.note || "", placeholder: "Optional: what to say, e.g. yes to Friday, ask the price" });
  const go = h("button", { class: "copy accept", type: "button", onclick: () => write() }, redo ? "Rewrite" : "Write draft");
  const wait = h("span", { class: "wait", hidden: true }, "Claude is writing… about half a minute");
  async function write() {
    const edited = draftEdits[t.id] != null && draftEdits[t.id] !== t.draft?.body;
    if (redo && edited && !confirm("Replace your edits with a new draft?")) return;
    wait.hidden = false;
    // your old edits go before the redraw, so the new draft shows
    const ok = await mailAct(go, "draft", { thread: t.id, note: input.value }, () => { delete draftEdits[t.id]; return mailFlash; });
    if (ok) focusDraft(t.id);
    else wait.hidden = true;
  }
  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !go.disabled) write();
    if (e.key === "Escape") onCancel();
  });
  setTimeout(() => input.focus());
  return h("div", { class: "draft-ask" }, input, go, h("button", { class: "linkish", type: "button", onclick: onCancel }, "Cancel"), wait);
}

function draftStatus(dr) {
  if (dr.in_gmail && !dr.unsaved) return ["ok", "In Gmail Drafts · send it from Gmail"];
  if (dr.in_gmail) return ["warn", "Changed here · Gmail still has the older version"];
  return ["", "Only here · not in Gmail yet"];
}

function draftBox(t) {
  const dr = t.draft, extra = h("div");
  const text = draftEdits[t.id] ?? dr.body;
  const area = h("textarea", { rows: "4",  // CSS field-sizing grows it with the text, up to 14 lines
                               "aria-label": `Reply draft for ${t.subject || "this email"}` }, text);
  const [cls, said] = draftStatus(draftEdits[t.id] != null && draftEdits[t.id] !== dr.body ? { ...dr, unsaved: true } : dr);
  const status = h("span", { class: "status " + cls }, said);
  area.addEventListener("input", () => {
    draftEdits[t.id] = area.value;
    if (dr.in_gmail) {
      const [c, w] = draftStatus({ ...dr, unsaved: area.value !== dr.body || dr.unsaved });
      status.className = "status " + c;
      status.textContent = w;
    }
  });
  const save = h("button", { class: "copy accept", type: "button",
                             title: "Put this text in Gmail Drafts as a reply in the thread (to the sender only). Nothing is ever sent from here.",
                             // the card stays and its status line says "In Gmail Drafts"
                             onclick: e => mailAct(e.currentTarget, "draft-save", { thread: t.id, text: area.value },
                                                   () => { delete draftEdits[t.id]; return mailFlash; }) },
                  dr.in_gmail ? "Update Gmail draft" : "Save to Gmail drafts");
  const copy = h("button", { class: "copy", type: "button", "aria-label": "Copy the draft", onclick: async () => {
    try { await navigator.clipboard.writeText(area.value); copy.textContent = "Copied"; }
    catch { area.select(); copy.textContent = "Press Ctrl+C"; }  // the clipboard needs HTTPS
    setTimeout(() => (copy.textContent = "Copy"), 1500);
  } }, "Copy");
  const redo = h("button", { class: "copy", type: "button", title: "Have Claude write it again, optionally with a note",
                             onclick: () => extra.replaceChildren(draftAsk(t, () => extra.replaceChildren(), true)) }, "Redo…");
  const discard = h("button", { class: "linkish", type: "button",
                                title: dr.in_gmail ? "Forget it here; the copy in Gmail Drafts stays" : "Forget this draft",
                                onclick: e => {
                                  if (!confirm(dr.in_gmail ? "Discard this draft here? The copy in Gmail Drafts stays there." : "Discard this draft?")) return;
                                  mailAct(e.currentTarget, "draft-drop", { thread: t.id }, () => { delete draftEdits[t.id]; return mailFlash; });
                                } }, "Discard");
  return h("div", { class: "draft" },
    h("div", { class: "draft-head" },
      h("b", {}, "Reply draft"),
      h("span", { class: "tag" + (dr.source === "claude" ? " claude" : "") }, dr.source === "claude" ? "Claude" : "edited by you"),
      status,
      dr.older && h("span", { class: "status warn" }, "· a newer message came in since")),
    dr.note && h("div", { class: "detail" }, `You asked: “${dr.note}”`),
    area,
    h("div", { class: "draft-actions" }, save, copy, redo, discard),
    extra);
}

function draftSection(t) {
  if (t.draft) return draftBox(t);
  const place = h("div", { class: "draft-place" });
  const start = () => place.replaceChildren(
    h("button", { class: "copy", type: "button", title: "Claude writes a reply for you to edit here; nothing goes to Gmail until you save it",
                  onclick: () => place.replaceChildren(draftAsk(t, start, false)) }, "✎ Draft a reply"));
  start();
  return place;
}

function decidedText(dec) {
  if (dec.via === "gmail") return "✓ Labelled in Gmail";
  return `✓ You chose ${queueTitle(dec.queue)}${dec.queue === "delete" ? " · marked for Trash" : dec.queue === "later" ? " · left unread in your inbox" : ""}`;
}

function threadCard(d, t, inQueue) {
  const rec = t.rec, s = t.sender, dec = t.decided, chosen = dec?.queue, live = d.actions_enabled;
  // the suggestion first, then its alternatives, then the rest
  const order = [...new Set([rec?.queue, ...(rec?.alternatives || []), ...CHOICES])].filter(c => CHOICES.includes(c));
  const days = t.waiting_days;
  return h("div", { class: "card thread" + (t.unread ? " unread" : ""), "data-thread": t.id, "data-queue": t.queue },
    h("div", { class: "thread-top" },
      t.unread && h("span", { class: "unread-dot", title: "Unread", role: "img", "aria-label": "unread" }),
      h("span", { class: "from", title: t.from_addr }, t.from_name || t.from_addr || "(unknown sender)"),
      t.from_name && t.from_addr && h("span", { class: "addr" }, t.from_addr),
      t.messages > 1 && h("span", { class: "count", title: `${t.messages} messages` }, String(t.messages)),
      inQueue && pill(queueTitle(t.queue)),
      h("span", { class: "when", title: new Date(t.date).toLocaleString() }, ago(t.date))),
    h("div", { class: "subject" }, t.subject || "(no subject)"),
    t.snippet && h("div", { class: "snippet" }, t.snippet),
    h("div", { class: "facts" },
      rec && h("div", { class: "suggest" }, "Suggested: ", h("b", {}, queueTitle(rec.queue)), rec.why ? " — " + rec.why : "",
        rec.source && h("span", { class: "tag " + (rec.source === "claude" ? "claude" : "rule"), title: "who suggested it" },
                        rec.source === "claude" ? "Claude" : "rule"),
        typeof rec.confidence === "number" && h("span", { class: "tag", title: "confidence" }, Math.round(rec.confidence * 100) + "%")),
      rec?.todo && h("div", { class: "todo" }, "To do: " + rec.todo),
      days != null && h("div", { class: "waiting" + (t.overdue ? " overdue" : "") },
        `waiting ${days} day${days === 1 ? "" : "s"}${t.overdue ? " · overdue" : ""}`),
      h("div", { class: "detail history" },
        s ? `opened ${s.opened} of ${s.received}, replied ${s.replied}` : "new sender"),
      dec && h("div", { class: "decided" }, decidedText(dec)),
      dec && live && reasonLine(t.id, dec.reason, () => mailFlash)),  // the card redraws with it; keep any flash
    live && canDraft(t) && draftSection(t),
    h("div", { class: "choices", role: "group", "aria-label": "Move to" },
      // undecided: the suggestion is outlined with "suggested"; decided: your choice is solid with a ✓, pressed and not clickable again
      order.map(c => h("button", { class: "copy choice" + (c === chosen ? " primary chosen" : !chosen && c === rec?.queue ? " suggested" : ""),
                                   type: "button", "data-choice": c, "aria-pressed": chosen ? String(c === chosen) : null,
                                   disabled: !live || c === chosen, "data-locked": c === chosen ? "1" : null,
                                   title: live ? (c === chosen ? "Your choice" : CHOICE_HINT[c] || null) : "Suggestions only: nothing is changed in Gmail yet",
                                   onclick: e => decide(e.currentTarget, t, c) },
                         c === chosen ? "✓ " + choiceTitle(c) : choiceTitle(c),
                         !chosen && c === rec?.queue && h("span", { class: "hint" }, "suggested"))),
      live && (chosen === "action" || chosen === "respond") &&
        h("button", { class: "copy choice done", type: "button", "data-choice": "done", title: "Archive it and drop the label",
                      onclick: e => decide(e.currentTarget, t, "done") }, "Done"),
      live && chosen && h("button", { class: "copy undo", type: "button", title: "Put it back as it was before your first choice",
                                      onclick: e => undo(e.currentTarget, t) }, "Undo"),
      /^https:\/\//.test(t.gmail_url || "") &&
        h("a", { class: "copy gmail", href: t.gmail_url, target: "_blank", rel: "noopener" }, "Open in Gmail")));
}

function noteCard(n) {
  const level = NOTE_LEVEL[n.level] ? n.level : "info";
  const [word, kind] = NOTE_LEVEL[level];
  return h("div", { class: "card note-card " + level, "data-level": level },
    h("div", { class: "card-head" }, h("h4", {}, n.title || ""), pill(word, kind || "info"),
      h("span", { class: "detail", style: "margin-left:auto", title: new Date(n.date).toLocaleString() }, ago(n.date))),
    n.text && h("p", {}, n.text));

// The main pane: the selected queue's cards, or search matches from every queue
function mailPane(d, sel) {
  if (!d.connected) return [h("div", { class: "card mail-empty" },
    h("h3", {}, sel.title), h("p", { class: "detail" }, sel.hint),
    d.error ? h("p", {}, "The mail sorter's state file can't be read: " + d.error)
            : [h("p", { class: "empty" }, "Emails aren't connected yet. Once the mail sorter runs, this pane lists the threads " +
                 "in each queue, newest first, each with a suggestion."),
               copyRow("Turn on the mail sorter (it runs every hour):", d.setup, "mail sorter setup command")])];
  const q = mailQuery.trim(), needle = q.toLowerCase();
  let title = sel.title, hint = sel.hint, cards, none;
  if (needle) {
    const hits = d.threads.filter(t => [t.from_name, t.from_addr, t.subject, t.snippet].some(f => String(f || "").toLowerCase().includes(needle)));
    title = `Search: “${q}”`;
    hint = `${hits.length} match${hits.length === 1 ? "" : "es"} across all queues`;
    cards = hits.map(t => threadCard(d, t, true));
    none = "No emails match.";
  } else if (sel.id === "agent-notes") {
    cards = d.notes.map(noteCard);
    none = "No notes from the sorter.";
  } else if (sel.id === "all") {
    cards = d.threads.map(t => threadCard(d, t, true));
    none = "No threads in the last " + (d.window_days || "few") + " days.";
  } else {
    cards = d.threads.filter(t => t.queue === sel.id).map(t => threadCard(d, t, false));
    none = sel.id === "inbox" ? "Inbox zero: nothing left to sort." : `Nothing in ${sel.title}.`;
  }
  const marked = d.trash.marked;
  // Accept all: the suggestions on this view's cards you haven't chosen yet (the queue's, or every queue's on All)
  const pending = needle || !(sel.id === "all" || SUGGESTED.includes(sel.id)) ? [] :
    d.threads.filter(t => (sel.id === "all" || t.queue === sel.id) && !t.decided && SUGGESTED.includes(t.rec?.queue) && t.queue === t.rec.queue);
  const shown = new Set(cards.map(c => c.dataset.thread).filter(Boolean));
  const flash = mailFlash && !(mailFlash.thread && shown.has(mailFlash.thread)) && mailFlash;
  const flashed = flash && d.threads.find(t => t.id === flash.thread);
  if (flash) {  // in the card's old place: after the nearest card that was before it, else first
    const el = h("div", { class: "mail-flash", role: "status", tabindex: "-1" }, h("span", {}, flash.text),
      flash.undo && d.actions_enabled && h("button", { class: "copy undo", type: "button",
        onclick: e => undo(e.currentTarget, flashed || { id: flash.thread, subject: flash.subject }) }, "Undo"),
      flash.reasonable && d.actions_enabled && reasonLine(flash.thread, flash.reason, reason => ({ ...flash, reason })));
    const prev = (flash.before || []).find(id => shown.has(id));
    cards.splice(prev ? cards.findIndex(c => c.dataset.thread === prev) + 1 : 0, 0, el);
  }
  return [
    h("div", { class: "mail-head" }, h("h3", {}, title), h("p", { class: "detail" }, hint)),
    (needle || sel.id !== "agent-notes") && (d.actions_enabled
      ? h("div", { class: "mail-help" }, "Action/Respond: label, stays in inbox · Review: label + archive · Delete: mark, then Trash all · No action: read, stays in inbox, off this page · Later: left as is, unread · ✎ Draft a reply: Claude writes, you edit, Save puts it in Gmail Drafts (never sent)")
      : h("div", { class: "mail-only" }, "Suggestions only — nothing is changed in Gmail yet.")),
    pending.length > 0 && h("div", { class: "card mail-accept" },
      h("span", {}, `${pending.length} suggestion${pending.length === 1 ? "" : "s"} not chosen yet`),
      h("button", { class: "copy accept", type: "button", disabled: !d.actions_enabled,
                    title: d.actions_enabled ? "As if you clicked the highlighted button on each card" : "Suggestions only: nothing is changed in Gmail yet",
                    onclick: e => acceptAll(e.currentTarget, pending) },
        pending.length === 1 ? "Accept the suggestion" : `Accept all ${pending.length} suggested`)),
    !needle && sel.id === "delete" && marked.length > 0 && h("div", { class: "card mail-trash" },
      h("span", {}, `${marked.length} marked for Trash`),
      h("button", { class: "copy danger", type: "button", disabled: !d.actions_enabled,
                    onclick: e => trashAll(e.currentTarget, [...marked]) }, `Trash all ${marked.length} marked`)),
    cards.some(c => c.classList.contains("thread") || c.classList.contains("note-card")) ? cards
      : [...cards, h("div", { class: "card empty" }, none)],
  ];
}

function emails(d) {
  mailBadge(d);
  if (d.syncing) watchSync();
  const queues = QUEUES.map(q => ({ ...q, ...(d.connected && d.queues.find(x => x.id === q.id)) }));
  const all = { id: "all", title: "All inboxes",
                hint: d.window_days ? `Every thread with activity in the last ${d.window_days} days` : "Every thread", count: d.threads?.length };
  const sel = subpath === "all" ? all : queues.find(q => q.id === subpath) || queues[0];
  const problem = mailProblem(d);
  const paneKids = () => mailPane(d, sel).flat(Infinity).filter(Boolean);
  const pane = h("div", { class: "mail-pane" }, paneKids());
  const search = h("input", { class: "mail-search", type: "search", placeholder: "Search emails…", "aria-label": "Search emails",
                              disabled: !d.connected });
  search.value = mailQuery;
  search.addEventListener("input", () => { mailQuery = search.value; pane.replaceChildren(...paneKids()); });
  // picking the queue that's already open clears the search (there's no hashchange to do it)
  const pick = e => {
    if (e.currentTarget.getAttribute("href") !== location.hash || !mailQuery) return;
    e.preventDefault();
    mailQuery = search.value = "";
    pane.replaceChildren(...paneKids());
  };
  return [
    h("div", { class: "page-head" }, h("h2", {}, "Emails"), mailFresh(d)),
    h("div", { class: "mail" },
      h("div", { class: "card mail-side" },
        search,
        problem && h("div", { class: "mail-warn " + problem.kind, role: "status" }, problem.text),
        h("a", { class: "mail-all", href: "#emails/all", "data-queue": "all", "aria-current": sel === all ? "page" : null, onclick: pick },
          h("span", { class: "q-name" }, all.title),
          d.connected ? all.count > 0 && h("span", { class: "count" }, String(all.count)) : queueBadge(d, all)),
        h("h3", { class: "label", id: "queues-label" }, "Queues"),
        h("div", { class: "queues", role: "navigation", "aria-labelledby": "queues-label" }, queues.map(x =>
          h("a", { href: "#emails/" + x.id, "data-queue": x.id, "aria-current": x === sel ? "page" : null, onclick: pick },
            h("span", { class: "q-name" }, x.title), queueBadge(d, x))))),
      pane),
  ];
}

// Launcher for a separate dashboard app on this Pi (tailnet only); /api/rei reads its units and health summary
function vaultSyncText(v) {
  if (v.state === "not set up") return "not set up";
  if (v.state === "off") return "off (timer not enabled; it needs the rclone remote gdrive:)";
  const last = v.last_sync ? `last synced ${dur(Math.max(0, Math.round(Date.now() / 1000 - v.last_sync)))} ago` : "hasn't synced yet";
  return [v.state === "failed" ? "timer failed" : "on", last, v.last_failed && "last run failed"].filter(Boolean).join(" · ");
}

function rei(d) {
  const health = d.health;
  const [word, kind] = siteStatus(d.unit_state, health.reachable);  // reachable: its healthz answered
  const down = word === "stopped" || word === "failed";
  const canOpen = word === "running" && d.published && d.url;
  const why = down ? "REI isn't running" : !d.url ? "Tailscale isn't up" : !d.published ? "Not published on the tailnet" : "Not answering yet";
  const fact = (term, value) => [h("dt", {}, term), h("dd", {}, value)];
  return [
    h("h2", {}, "REI"),
    h("div", { class: "sub", style: "margin-bottom:12px" }, "A separate dashboard app on this Pi, on the tailnet only (not the home Wi-Fi)."),
    h("div", { class: "card rei" },
      h("div", { class: "card-head" }, h("h4", {}, "REI Dashboard"), h("span", { class: "status" }, pill(word, kind))),
      h("div", { class: "detail" }, "Property portfolio: filings, taxes and alerts"),
      h("dl", {},
        fact("Version", health.version || "–"),
        fact("Vault sync", vaultSyncText(d.vault_sync)),
        health.errors > 0 && fact("Health check", `${health.errors} error${health.errors === 1 ? "" : "s"}`),
        health.reachable && !health.ok && !health.errors && fact("Health check", "not ok"),
        fact("Next filing due", NO_COUNT), fact("Open alerts", NO_COUNT)),
      h("div", { class: "sub later" }, "Next filing due and open alerts come later."),
      d.url ? copyRow("Address (tailnet only)", d.url, "REI Dashboard address",
                      h("a", { class: "mono ssh-cmd", href: d.url, target: "_blank", rel: "noopener" }, d.url))
            : h("div", { class: "sub" }, "No HTTPS address: Tailscale isn't up, so the Pi has no tailnet name."),
      d.url && !d.published && copyRow("Not published on the tailnet yet. Run:", d.publish, "REI publish command"),
      down && copyRow(`${word === "failed" ? "It failed" : "It's stopped"}. Start it with:`, d.start, "REI start command"),
      canOpen ? h("a", { class: "copy rei-open", href: d.url, target: "_blank", rel: "noopener" }, "Open REI")
              : h("button", { class: "copy rei-open", type: "button", disabled: true, title: why }, "Open REI"),
      h("div", { class: "sub", style: "margin-top:8px" },
        "Services: ", h("span", { class: "mono" }, d.units.join(", ")), " · Folder: ", h("span", { class: "mono" }, d.folder))),
  ];
}

// A row with a label and one button per choice (the chosen one pressed)
function choiceRow(label, note, key, options) {

let keyBuf = [], keyTimer = null;
addEventListener("keydown", e => {
  if (!shortcutsOn() || e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey || e.isComposing) return;
  // typing, not a shortcut (a ticked checkbox or a chosen radio still lets them through)
  if (e.target.closest?.("input:not([type=checkbox], [type=radio]), textarea, select, [contenteditable]")) return;
  if ([...e.key].length !== 1 || e.key === " ") return;   // Enter, arrows, Tab, Space keep their usual jobs
  const list = shortcuts().filter(x => x.on && x.keys);
  const look = buf => {
    const seq = buf.join(" ");
    return { hit: list.find(x => x.keys === seq), more: list.some(x => x.keys.startsWith(seq + " ")) };
  };
  let buf = [...keyBuf, e.key], r = look(buf);
  if (!r.hit && !r.more && keyBuf.length) { buf = [e.key]; r = look(buf); }   // a fresh start, not the rest of a sequence
  clearTimeout(keyTimer);
  keyBuf = [];
  if (r.hit) { e.preventDefault(); $("keys-help")?.close(); r.hit.run(); }
  else if (r.more) { e.preventDefault(); keyBuf = buf; keyTimer = setTimeout(() => { keyBuf = []; }, 1500); }
});

  input.addEventListener("change", () => {
    const keys = input.value.trim() === "" ? "" : normKeys(input.value);
    const other = keys && clash(keys, x.id);
    const why = keys === null ? "Use 1–3 single keys with spaces between, like g e"

// ---------- version (bottom of the sidebar) ----------
let restarting = false;

async function restartServer(btn) {
  restarting = true;
  btn.disabled = true;
  btn.textContent = "Restarting…";
  // The custom header is what stops other websites from triggering this POST.
  try { await fetch("/api/restart", { method: "POST", headers: { "X-Requested-With": "pi-status" } }); } catch {}
  for (let i = 0; i < 30; i++) {  // wait for the new process, then reload to pick up the new page too
    await new Promise(r => setTimeout(r, 1000));
    try {
      const v = await getJSON("/api/version");
      if (!v.stale) { location.reload(); return; }
    } catch {}  // the server is down for a moment while it restarts
  }
  restarting = false;
  btn.disabled = false;
  btn.textContent = "Restart now";
}

async function loadVersion() {
  if (restarting) return;
  const el = $("version");
  try {
    const v = lastVersion = await getJSON("/api/version");
    $("view").querySelector(".attention")?.replaceWith(attentionCard());  // Overview may have rendered before this arrived
    const btn = v.stale && v.can_restart && h("button", { class: "copy", type: "button", onclick: e => restartServer(e.currentTarget) }, "Restart now");
    el.replaceChildren(...[v.label, v.stale && h("span", { class: "stale" }, "newer code on disk: " + (btn ? "restart to update" : "restart the server to update")), btn].filter(Boolean));
    el.title = v.stale
      ? `Running: ${v.running_label}\nOn disk:  ${v.label}`
      : v.dirty ? "Includes changes that aren't committed yet" : "Running the latest committed code";
  } catch {
    el.replaceChildren("version unavailable");
  }
}

function toggleGroup(btn) {

}

    role: "group", "aria-labelledby": "nav-" + g, "data-group": g },
  h("button", { class: "nav-label", id: "nav-" + g, type: "button", "aria-expanded": String(!folded.includes(g)),
                title: "Show or hide this group", onclick: e => toggleGroup(e.currentTarget) }, g),

$("nav-foot").append(...TABS.filter(t => !t.group).map(t => h("a", { href: "#" + t.id, "data-tab": t.id }, t.title)));

async function getJSON(url) {
  const r = await fetch(url, { cache: "no-store" });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || r.status);
  return data;
}

function show(tab, out) {
  $("view").style.minHeight = "";
  $("view").replaceChildren(...[tab.sub ? [h("h2", {}, tab.title), subtabs(), out] : out].flat(Infinity).filter(Boolean));
}

async function refresh() {
  const tab = current, v = currentView;
  if (!v.api) {  // a placeholder: nothing to load, so no "updated" time and never "unreachable"
    show(tab, v.render());
    if (!v.local) $("conn").replaceChildren(h("span", { class: "dot idle" }), "no live data");
    return;
  }
  try {
    const [data, ...extra] = await Promise.all([
      getJSON(v.api),
      ...(v.also || []).map(url => getJSON(url).catch(() => null)),  // optional extras never break the tab
    ]);
    if (v !== currentView) return;  // user switched tabs while this was loading
    lastLoad = { view: v, args: [data, ...extra] };
    show(tab, v.render(data, ...extra));
    $("conn").replaceChildren(h("span", { class: "dot" }), "updated " + new Date().toLocaleTimeString());
  } catch (e) {
    $("conn").replaceChildren(h("span", { class: "dot off" }), "unreachable");
    if (v === currentView && !$("view").children.length) $("view").replaceChildren(empty("Couldn't load: " + e.message));
  }
}

function route() {
  const [id, ...rest] = location.hash.slice(1).split("/");
  if (!id && prefs.start && prefs.start !== TABS[0].id && TABS.some(t => t.id === prefs.start)) {   // Settings' start page
    history.replaceState(null, "", "#" + prefs.start);
    return route();
  }
  if (SYSTEM.some(s => s.id === id)) {  // old bookmarks (#ports) now live under System; no extra history entry
    history.replaceState(null, "", `#system/${id}`);
    return route();
  }
  if (id === "emails" && rest[0] === "spam") {  // the Spam queue is now Delete
    history.replaceState(null, "", "#emails/delete");
    return route();
  }
  const before = currentView;
  current = TABS.find(t => t.id === id) || TABS[0];
  subpath = decodeURIComponent(rest.join("/"));
  currentView = current.sub ? current.sub.find(s => s.id === subpath) || current.sub[0] : current;
  for (const a of document.querySelectorAll(".side a[data-tab]")) {
    if (a.dataset.tab === current.id) a.setAttribute("aria-current", "page");
    else a.removeAttribute("aria-current");
  }
  mailQuery = "";
  mailFlash = null;
  if (currentView === before && currentView.keep && lastLoad?.view === currentView) {
    show(current, currentView.render(...lastLoad.args));
    return;
  }
  $("view").replaceChildren();
  refresh();  // once per tab visit; nothing polls in the background, use the Refresh button for fresh numbers
}

addEventListener("hashchange", route);
route();
loadVersion();
if (current.id !== "emails") loadMail();  // the Emails badge and tab title; the Emails tab fetches it itself

$("refresh").addEventListener("click", async e => {
  const btn = e.currentTarget;
  btn.disabled = true;
  btn.textContent = "Refreshing…";
  await Promise.all([refresh(), loadVersion(), current.id !== "emails" && loadMail()]);
  btn.disabled = false;
  btn.textContent = "Refresh";
});
// the sidebar shows the hostname whichever tab is open
// (on a tab with nothing to load, such as Settings, it also says whether the Pi answered)
const connWaiting = () => current.local && $("conn").textContent === "connecting…";
if (current.id !== "overview") fetch("/api/status").then(r => r.json()).then(d => {
  brand(d);
  if (connWaiting()) $("conn").replaceChildren(h("span", { class: "dot" }), "updated " + new Date().toLocaleTimeString());
}).catch(() => { if (connWaiting()) $("conn").replaceChildren(h("span", { class: "dot off" }), "unreachable"); });
</script>
</body>
</html>
